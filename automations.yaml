  description: 'Turn off light.bathtub_light'
  trigger: 
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.minute
  conditions: 
    - or:
      - condition: 
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.light.bathtub_light.last_updated) > 3600 }}'
        - condition: template
          value_template: '{{ states.light.bathtub_light.state == "on" }}'
      - condition: 
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.light.bathtub_light.last_updated) > 36000 }}'
  action: 
  - type: turn_off
    device_id: 921c67fcff28cf8d5cf6d8e9ce01ce5d
    entity_id: light.bathtub_light
    domain: light
  mode: single

