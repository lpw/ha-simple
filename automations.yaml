  alias: Turn off light.office_lights
  description: 'Turn off light.office_lights'
  trigger: 
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.minute
  conditions: 
    - or:
      - condition: 
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.light.office_lights.last_updated) > 3600 }}'
        - condition: template
          value_template: '{{ states.light.office_lights.state == "on" }}'
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.binary_sensor.office_ecolink_r12.last_updated) > 3600 }}'
      - condition: 
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.light.office_lights.last_updated) > 36000 }}'
        - condition: template
          value_template: '{{ as_timestamp(now()) - as_timestamp(states.binary_sensor.office_ecolink_r12.last_updated) > 36000 }}'
  action: 
  - type: turn_off
    device_id: 2b4a608bbc48e9caf0c797d5c99e5edf
    entity_id: light.office_lights
    domain: light
  mode: single

