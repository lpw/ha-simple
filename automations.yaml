
- id: 'id_on Office Lights light.office_lights'
  alias: Turn on Office Lights light.office_lights
  description: 'Turn on Office Lights light.office_lights'
  trigger: 
  - type: turned_on
    platform: device
    device_id: b8d59298317b2fabee66cddad7a201db
    entity_id: binary_sensor.office_ecolink_r12
    domain: binary_sensor
  conditions: 
  - condition: template
